---
- name: Set platform/version specific variables
  ansible.builtin.include_tasks: tasks/set_vars.yml

- name: Validate the platform and the role parameters
  ansible.builtin.include_tasks: assert_role_vars.yml

- name: Check the host before any change
  ansible.builtin.include_tasks: preflight.yml

- name: Turn remote login off
  ansible.builtin.include_tasks: disable.yml
  when: not remote_desktop_enabled | bool

- name: Turn remote login on
  when: remote_desktop_enabled | bool
  block:
    - name: Ensure required packages are installed
      ansible.builtin.package:
        name: "{{ __remote_desktop_packages }}"
        state: present
        use: "{{ (__remote_desktop_is_ostree | d(false)) |
                 ternary('ansible.posix.rhel_rpm_ostree', omit) }}"
      register: __remote_desktop_package_result

    # A staged install reports ok on re-runs, so ask rpm (by provides) if it is live.
    - name: Check whether the packages are live on a transactional update system
      ansible.builtin.command:  # noqa command-instead-of-module
        argv: "{{ ['rpm', '-q', '--whatprovides'] + __remote_desktop_packages }}"
      register: __remote_desktop_packages_live
      changed_when: false
      failed_when: false
      check_mode: false
      when: __remote_desktop_is_transactional | d(false)

    - name: Handle reboot for transactional update systems
      when:
        - __remote_desktop_is_transactional | d(false)
        - __remote_desktop_package_result is changed or
          (__remote_desktop_packages_live.rc | d(0)) != 0
      block:
        - name: Notify user that reboot is needed to apply changes
          ansible.builtin.debug:
            msg: >
              Reboot required to apply changes due to transactional updates.

        - name: Reboot transactional update systems
          ansible.builtin.reboot:
            msg: Rebooting the system to apply transactional update changes.
          when:
            - remote_desktop_transactional_update_reboot_ok is not none
            - remote_desktop_transactional_update_reboot_ok | bool

        - name: Fail if reboot is needed and not set
          ansible.builtin.fail:
            msg: >
              Reboot is required but not allowed. Please set 'remote_desktop_transactional_update_reboot_ok' to proceed.
          when:
            - remote_desktop_transactional_update_reboot_ok is none

        - name: Notify user that configuration is skipped until the packages are live
          ansible.builtin.debug:
            msg: Configuration is skipped until the packages are live; reboot and run the role again
          when:
            - remote_desktop_transactional_update_reboot_ok is not none
            - not remote_desktop_transactional_update_reboot_ok | bool

        # Every later step needs the staged packages
        - name: End the role until the packages are live
          ansible.builtin.meta: end_role
          when:
            - remote_desktop_transactional_update_reboot_ok is not none
            - not remote_desktop_transactional_update_reboot_ok | bool

    - name: Notify user that check mode does not simulate the configuration
      ansible.builtin.debug:
        msg: Configuration is not simulated until the packages are installed.
      when:
        - __remote_desktop_check_mode | bool
        - __remote_desktop_package_result is changed

    # The service account, grdctl and the units are installed by those packages
    - name: End the role in check mode while packages would change
      ansible.builtin.meta: end_role
      when:
        - __remote_desktop_check_mode | bool
        - __remote_desktop_package_result is changed

    # Version, openssl and the account's home arrive with a fresh install
    - name: Check the host again with the packages installed
      ansible.builtin.include_tasks: preflight.yml
      when: __remote_desktop_package_result is changed  # noqa no-handler

    - name: Configure remote login
      ansible.builtin.include_tasks: configure.yml

    # Ansible drops the handlers of a failed run; a daemon older than an input missed its restart
    - name: Restart gnome-remote-desktop when an input is newer than the daemon
      when: __remote_desktop_is_booted | bool
      vars:
        __started_us: "{{ __remote_desktop_unit_state.stdout
          | regex_findall('(?m)^t ([0-9]+)$') | first | d('0') | int }}"
        __started: "{{ (__started_us | int) / 1000000 }}"
        __now: "{{ __remote_desktop_now.stdout | float }}"
        __inputs: "{{ __remote_desktop_inputs_stat.results | selectattr('stat.exists') | list }}"
        __future: "{{ __inputs | selectattr('stat.mtime', 'gt', __now | float)
          | map(attribute='item') | list }}"
        __newer: "{{ __inputs | selectattr('stat.mtime', 'gt', __started | float)
          | selectattr('stat.mtime', 'le', __now | float) | list }}"
      block:
        - name: Read the state and start time of gnome-remote-desktop
          ansible.builtin.command:
            argv:
              - busctl
              - --system
              - get-property
              - org.freedesktop.systemd1
              - "{{ __remote_desktop_unit_path }}"
              - org.freedesktop.systemd1.Unit
              - ActiveState
              - ActiveEnterTimestamp
          register: __remote_desktop_unit_state
          changed_when: false
          check_mode: false

        - name: Read the current time
          ansible.builtin.command:
            argv:
              - date
              - +%s.%N
          register: __remote_desktop_now
          changed_when: false
          check_mode: false

        - name: Read the modification times of the inputs of gnome-remote-desktop
          ansible.builtin.stat:
            path: "{{ item }}"
            follow: false
            get_checksum: false
            get_mime: false
            get_attributes: false
          loop: "{{ [__remote_desktop_conf, __remote_desktop_active_cert, __remote_desktop_active_key]
            + __remote_desktop_credential_stores }}"
          register: __remote_desktop_inputs_stat

        - name: Warn about inputs of gnome-remote-desktop modified in the future
          ansible.builtin.debug:
            msg: "Modified in the future, so not compared with the daemon's start: {{ __future | join(', ') }}"
          when: __future | length > 0

        - name: Report that an input of gnome-remote-desktop is newer than the daemon
          ansible.builtin.debug:
            msg: An input of gnome-remote-desktop changed after the daemon started.
          changed_when: true
          notify: Restart gnome-remote-desktop
          when:
            - (__remote_desktop_unit_state.stdout_lines | first | d('')) == 's "active"'
            - __started_us | int > 0
            - __newer | length > 0

    - name: Restart gnome-remote-desktop now, so that a stopped daemon starts once
      ansible.builtin.meta: flush_handlers

    - name: Ensure gnome-remote-desktop is enabled and started
      ansible.builtin.systemd_service:
        name: "{{ __remote_desktop_service }}"
        enabled: true
        state: "{{ 'started' if __remote_desktop_is_booted | bool else omit }}"

    - name: Verify that remote login is served
      ansible.builtin.include_tasks: verify.yml
      when:
        - __remote_desktop_is_booted | bool
        - not __remote_desktop_check_mode | bool

    - name: Open the RDP port in firewalld
      ansible.builtin.include_tasks: firewall.yml
      when: remote_desktop_manage_firewall | bool

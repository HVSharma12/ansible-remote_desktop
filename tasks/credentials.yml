---
- name: Ensure the RDP credentials
  vars:
    __expected:
      - "\tUsername: {{ remote_desktop_username | string }}"
      - "\tPassword: {{ remote_desktop_password | string }}"
    # Whole lines, so that a password is never taken for a prefix of the stored one
    __match: "{{ __expected | difference((__remote_desktop_credentials.stdout | d('')).split('\n'))
      | length == 0 }}"
  block:
    - name: Read the stored credentials as the service account
      ansible.builtin.command:
        argv: "{{ __remote_desktop_runuser + ['grdctl', 'status', '--show-credentials'] }}"
        chdir: "{{ __remote_desktop_home }}"
      register: __remote_desktop_credentials
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: "{{ remote_desktop_secure_logging }}"
      when: __remote_desktop_store_present | bool

    - name: Compare the stored credentials with the requested ones
      ansible.builtin.set_fact:
        __remote_desktop_credentials_match: "{{ __match }}"
        __remote_desktop_credentials: ""
      no_log: "{{ remote_desktop_secure_logging }}"

    # Check mode skips the write, and with it the restart it notifies
    - name: Report that check mode would store the credentials
      ansible.builtin.debug:
        msg: The RDP credentials would be stored.
      changed_when: true
      notify: Restart gnome-remote-desktop
      when:
        - __remote_desktop_check_mode | bool
        - not __remote_desktop_credentials_match | bool

    - name: Store the credentials as the service account
      ansible.builtin.command:
        argv: "{{ __remote_desktop_runuser
          + ['grdctl', 'rdp', 'set-credentials', remote_desktop_username | string] }}"
        stdin: "{{ remote_desktop_password | string }}"
        chdir: "{{ __remote_desktop_home }}"
      when: not __remote_desktop_credentials_match | bool
      changed_when: true
      failed_when: false
      no_log: "{{ remote_desktop_secure_logging }}"
      notify: Restart gnome-remote-desktop

    - name: Read the credentials back as the service account
      ansible.builtin.command:
        argv: "{{ __remote_desktop_runuser + ['grdctl', 'status', '--show-credentials'] }}"
        chdir: "{{ __remote_desktop_home }}"
      register: __remote_desktop_credentials
      changed_when: false
      failed_when: false
      no_log: "{{ remote_desktop_secure_logging }}"
      when:
        - not __remote_desktop_credentials_match | bool
        - not __remote_desktop_check_mode | bool

    - name: Compare the credentials read back with the requested ones
      ansible.builtin.set_fact:
        __remote_desktop_credentials_match: "{{ __match }}"
        __remote_desktop_credentials: ""
      no_log: "{{ remote_desktop_secure_logging }}"
      when:
        - not __remote_desktop_credentials_match | bool
        - not __remote_desktop_check_mode | bool

    - name: Fail if the credentials were not stored
      ansible.builtin.fail:
        msg: >-
          grdctl rdp set-credentials did not store the RDP credentials for user
          {{ remote_desktop_username }}.
      when:
        - not __remote_desktop_credentials_match | bool
        - not __remote_desktop_check_mode | bool

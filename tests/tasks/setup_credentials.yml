---
- name: Generate throwaway RDP credentials once per test
  ansible.builtin.set_fact:
    __rd_test_user: rdtester
    __rd_test_pass: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=24) }}"
    __rd_wrong_pass: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=24) }}"
  no_log: true
  when: __rd_test_pass is not defined

---
- name: Change, keep and compare the RDP credentials
  hosts: all
  vars:
    __rd_user_b: rd.tester@example.test
    # The documented way to pass a password that Ansible must not template
    __rd_special_chars: !unsafe '{{ x }} {# y %} "q'' z é ü'
  tasks:
    - name: Test the credentials
      block:
        - name: Generate the test credentials
          ansible.builtin.include_tasks: tasks/setup_credentials.yml

        - name: Generate the other throwaway passwords once
          ansible.builtin.set_fact:
            __rd_pass_b: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=24) }}"
            __rd_suffix: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['digits'], length=4) }}"
            __rd_pass_special: >-
              {{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=12)
              ~ __rd_special_chars ~ lookup('ansible.builtin.password', '/dev/null', chars=['digits'], length=4) }}
          no_log: true

        - name: Install the RDP client
          ansible.builtin.include_tasks: tasks/install_rdp_client.yml

        - name: Turn remote login on with the first password
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            remote_desktop_username: "{{ __rd_test_user }}"
            remote_desktop_password: "{{ __rd_test_pass }}"

        - name: Authenticate with the first password
          ansible.builtin.include_tasks: tasks/check_rdp_auth.yml
          vars:
            __rd_auth_user: "{{ __rd_test_user }}"
            __rd_auth_pass: "{{ __rd_test_pass }}"
            __rd_auth_expect: ok

        - name: Read the state before the password changes
          ansible.builtin.include_tasks: tasks/read_state.yml

        - name: Keep the state before the password changes
          ansible.builtin.set_fact:
            __rd_before: "{{ __rd_state }}"

        - name: Change the password
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            remote_desktop_username: "{{ __rd_test_user }}"
            remote_desktop_password: "{{ __rd_pass_b }}"

        - name: Read the state after the password changed
          ansible.builtin.include_tasks: tasks/read_state.yml
          vars:
            __rd_since: "{{ __rd_before.now }}"

        - name: Assert that the change was stored and restarted the daemon once
          ansible.builtin.assert:
            that:
              - __rd_state.store_mtime != __rd_before.store_mtime
              - __rd_state.main_pid != __rd_before.main_pid
              - __rd_state.starts == '1'
            fail_msg: "Before: {{ __rd_before }} After: {{ __rd_state }}"
            quiet: true

        - name: Authenticate with the old password
          ansible.builtin.include_tasks: tasks/check_rdp_auth.yml
          vars:
            __rd_auth_user: "{{ __rd_test_user }}"
            __rd_auth_pass: "{{ __rd_test_pass }}"
            __rd_auth_expect: wrong_password

        - name: Authenticate with the new password
          ansible.builtin.include_tasks: tasks/check_rdp_auth.yml
          vars:
            __rd_auth_user: "{{ __rd_test_user }}"
            __rd_auth_pass: "{{ __rd_pass_b }}"
            __rd_auth_expect: ok

        - name: Keep the state before the same password is given again
          ansible.builtin.set_fact:
            __rd_before: "{{ __rd_state }}"

        - name: Give the same password again
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            remote_desktop_username: "{{ __rd_test_user }}"
            remote_desktop_password: "{{ __rd_pass_b }}"

        - name: Read the state after the same password
          ansible.builtin.include_tasks: tasks/read_state.yml
          vars:
            __rd_since: "{{ __rd_before.now }}"

        - name: Assert that the same password changed nothing
          ansible.builtin.include_tasks: tasks/assert_unchanged.yml
          vars:
            __rd_from: "{{ __rd_before | combine({'starts': '0'}) }}"
            __rd_to: "{{ __rd_state }}"
            __rd_keys: [main_pid, starts, store_mtime, conf_sha256]

        # A substring comparison would take the shorter password for the stored one
        - name: Store the password with a suffix
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            remote_desktop_username: "{{ __rd_test_user }}"
            remote_desktop_password: "{{ __rd_pass_b ~ __rd_suffix }}"

        - name: Read the state with the longer password stored
          ansible.builtin.include_tasks: tasks/read_state.yml

        - name: Keep the state with the longer password stored
          ansible.builtin.set_fact:
            __rd_before: "{{ __rd_state }}"

        - name: Give the password without the suffix
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            remote_desktop_username: "{{ __rd_test_user }}"
            remote_desktop_password: "{{ __rd_pass_b }}"

        - name: Read the state after the shorter password
          ansible.builtin.include_tasks: tasks/read_state.yml
          vars:
            __rd_since: "{{ __rd_before.now }}"

        - name: Assert that the shorter password was written
          ansible.builtin.assert:
            that:
              - __rd_state.store_mtime != __rd_before.store_mtime
              - __rd_state.starts == '1'
            fail_msg: "Before: {{ __rd_before }} After: {{ __rd_state }}"
            quiet: true

        - name: Authenticate with the password without the suffix
          ansible.builtin.include_tasks: tasks/check_rdp_auth.yml
          vars:
            __rd_auth_user: "{{ __rd_test_user }}"
            __rd_auth_pass: "{{ __rd_pass_b }}"
            __rd_auth_expect: ok

        - name: Authenticate with the password with the suffix
          ansible.builtin.include_tasks: tasks/check_rdp_auth.yml
          vars:
            __rd_auth_user: "{{ __rd_test_user }}"
            __rd_auth_pass: "{{ __rd_pass_b ~ __rd_suffix }}"
            __rd_auth_expect: wrong_password

        - name: Keep the state before the user name changes
          ansible.builtin.set_fact:
            __rd_before: "{{ __rd_state }}"

        - name: Change the user name
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            remote_desktop_username: "{{ __rd_user_b }}"
            remote_desktop_password: "{{ __rd_pass_b }}"

        - name: Read the state after the user name changed
          ansible.builtin.include_tasks: tasks/read_state.yml
          vars:
            __rd_since: "{{ __rd_before.now }}"

        - name: Assert that the user name change was stored and restarted the daemon once
          ansible.builtin.assert:
            that:
              - __rd_state.store_mtime != __rd_before.store_mtime
              - __rd_state.main_pid != __rd_before.main_pid
              - __rd_state.starts == '1'
            fail_msg: "Before: {{ __rd_before }} After: {{ __rd_state }}"
            quiet: true

        - name: Authenticate with the new user name
          ansible.builtin.include_tasks: tasks/check_rdp_auth.yml
          vars:
            __rd_auth_user: "{{ __rd_user_b }}"
            __rd_auth_pass: "{{ __rd_pass_b }}"
            __rd_auth_expect: ok

        - name: Authenticate with the old user name
          ansible.builtin.include_tasks: tasks/check_rdp_auth.yml
          vars:
            __rd_auth_user: "{{ __rd_test_user }}"
            __rd_auth_pass: "{{ __rd_pass_b }}"
            __rd_auth_expect: denied

        - name: Set a password with special characters
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            remote_desktop_username: "{{ __rd_user_b }}"
            remote_desktop_password: "{{ __rd_pass_special }}"

        - name: Authenticate with the password with special characters
          ansible.builtin.include_tasks: tasks/check_rdp_auth.yml
          vars:
            __rd_auth_user: "{{ __rd_user_b }}"
            __rd_auth_pass: "{{ __rd_pass_special }}"
            __rd_auth_expect: ok

        - name: Read the state with the password with special characters
          ansible.builtin.include_tasks: tasks/read_state.yml

        - name: Keep the state with the password with special characters
          ansible.builtin.set_fact:
            __rd_before: "{{ __rd_state }}"

        - name: Give the password with special characters again
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            remote_desktop_username: "{{ __rd_user_b }}"
            remote_desktop_password: "{{ __rd_pass_special }}"

        - name: Read the state after the password with special characters was given again
          ansible.builtin.include_tasks: tasks/read_state.yml
          vars:
            __rd_since: "{{ __rd_before.now }}"

        - name: Assert that the password with special characters compared equal
          ansible.builtin.include_tasks: tasks/assert_unchanged.yml
          vars:
            __rd_from: "{{ __rd_before | combine({'starts': '0'}) }}"
            __rd_to: "{{ __rd_state }}"
            __rd_keys: [main_pid, starts, store_mtime, conf_sha256]

        - name: Keep the state before the runs without credentials
          ansible.builtin.set_fact:
            __rd_before: "{{ __rd_state }}"

        - name: Run the role without credentials
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml

        - name: Run the role with empty credentials
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            remote_desktop_username: ""
            remote_desktop_password: ""

        - name: Read the state after the runs without credentials
          ansible.builtin.include_tasks: tasks/read_state.yml
          vars:
            __rd_since: "{{ __rd_before.now }}"

        - name: Assert that the runs without credentials kept the stored pair
          ansible.builtin.include_tasks: tasks/assert_unchanged.yml
          vars:
            __rd_from: "{{ __rd_before | combine({'starts': '0'}) }}"
            __rd_to: "{{ __rd_state }}"
            __rd_keys: [main_pid, starts, store_mtime, conf_sha256]

        - name: Authenticate with the kept credentials
          ansible.builtin.include_tasks: tasks/check_rdp_auth.yml
          vars:
            __rd_auth_user: "{{ __rd_user_b }}"
            __rd_auth_pass: "{{ __rd_pass_special }}"
            __rd_auth_expect: ok

        - name: Give a new password in check mode
          ansible.builtin.include_tasks:
            file: tasks/run_role_with_clear_facts.yml
            apply:
              check_mode: true
          vars:
            remote_desktop_username: "{{ __rd_user_b }}"
            remote_desktop_password: "{{ __rd_test_pass }}"

        - name: Read the state after the check run
          ansible.builtin.include_tasks: tasks/read_state.yml
          vars:
            __rd_since: "{{ __rd_before.now }}"

        - name: Assert that the check run changed nothing
          ansible.builtin.include_tasks: tasks/assert_unchanged.yml
          vars:
            __rd_from: "{{ __rd_before | combine({'starts': '0'}) }}"
            __rd_to: "{{ __rd_state }}"
            __rd_keys: [main_pid, starts, store_mtime, conf_sha256]

        - name: Authenticate with the password the check run did not replace
          ansible.builtin.include_tasks: tasks/check_rdp_auth.yml
          vars:
            __rd_auth_user: "{{ __rd_user_b }}"
            __rd_auth_pass: "{{ __rd_pass_special }}"
            __rd_auth_expect: ok

        - name: Check that the journal carries no test password
          ansible.builtin.include_tasks: tasks/check_journal.yml
          vars:
            __rd_secrets:
              - "{{ __rd_test_pass }}"
              - "{{ __rd_pass_b }}"
              - "{{ __rd_pass_b ~ __rd_suffix }}"
              - "{{ __rd_pass_special }}"
      always:
        - name: Clean up
          ansible.builtin.include_tasks: tasks/cleanup.yml
          tags: tests::cleanup

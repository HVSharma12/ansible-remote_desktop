---
- name: Ensure that a run with default parameters does not turn remote login on
  hosts: all
  tasks:
    - name: Run the role with default parameters
      block:
        - name: Read the state before the run
          ansible.builtin.include_tasks: tasks/read_state.yml

        - name: Keep the state before the run
          ansible.builtin.set_fact:
            __rd_before: "{{ __rd_state }}"

        - name: Require a host where remote login is off, the case in which defaults refuse
          ansible.builtin.assert:
            that:
              - __rd_before.enabled != 'enabled'
            fail_msg: gnome-remote-desktop.service is already enabled, so default parameters keep remote login on
            quiet: true

        - name: Run the role without credentials
          ansible.builtin.include_tasks: tasks/run_role_expect_failure.yml

        - name: Read the state after the run
          ansible.builtin.include_tasks: tasks/read_state.yml

        - name: Assert that the role refused and named both credential variables
          ansible.builtin.assert:
            that:
              - __rd_refused
              - "'remote_desktop_username' in __rd_refusal"
              - "'remote_desktop_password' in __rd_refusal"
            fail_msg: "refused={{ __rd_refused }}, message: {{ __rd_refusal }}"
            quiet: true

        - name: Assert that the refusal changed nothing
          ansible.builtin.include_tasks: tasks/assert_unchanged.yml
          vars:
            __rd_from: "{{ __rd_before }}"
            __rd_to: "{{ __rd_state }}"
            __rd_keys: [installed, enabled, active, conf_sha256, default_target]
      always:
        - name: Clean up
          ansible.builtin.include_tasks: tasks/cleanup.yml
          tags: tests::cleanup

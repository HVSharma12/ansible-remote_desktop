---
name: Ansible Lint

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible_lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: |
          pip3 install ansible==13.3.0 ansible-core==2.20.2 ansible-lint==26.4.0 yamllint==1.38.0

      # fedora.linux_system_roles is not part of the ansible package
      - name: Install the role's collections
        run: |
          ansible-galaxy collection install -r meta/collection-requirements.yml

      - name: Run yamllint
        run: |
          yamllint -c .yamllint.yml .

      - name: Run ansible-lint
        run: |
          ansible-lint --offline -v
